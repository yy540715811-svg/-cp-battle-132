// 绑定点击事件
function bindEvents(){
  const startBtn = document.getElementById("startBtn");
  if(startBtn){
    startBtn.onclick = ()=>{
      // 初始化胜者组，把全部cp放进去
      state.winnerBracket = structuredClone(cpList);
      state.loserBracket = [];
      state.matchCount=0;
      nextMatch();
    }
  }

  const backBtn = document.getElementById("backHome");
  if(backBtn){
    backBtn.onclick = ()=>{ state.page="home"; render(); }
  }

  const cards = document.querySelectorAll(".cp-card");
  cards.forEach(card=>{
    card.onclick = ()=>{
      const pick = card.dataset.pick;
      const match = state.currentMatch;
      state.matchCount++;
      if(pick === "p1"){
        winLogic(match.player1, match.player2);
      }else{
        winLogic(match.player2, match.player1);
      }
      nextMatch();
    }
  })
}

// 双败胜负逻辑
function winLogic(winner, loser){
  // 胜者留在胜者组晋级，败者丢入败者组
  const winIdx = state.winnerBracket.indexOf(winner);
  if(winIdx !== -1) state.winnerBracket.splice(winIdx,1);
  state.winnerBracket.push(winner);

  const loseIdx = state.winnerBracket.indexOf(loser);
  if(loseIdx !== -1){
    state.winnerBracket.splice(loseIdx,1);
    state.loserBracket.push(loser);
  }else{
    // 败者组再次失败 → 淘汰
    const loseIdx2 = state.loserBracket.indexOf(loser);
    if(loseIdx2 !== -1) state.loserBracket.splice(loseIdx2,1);
  }
}

// 取出下一场对战，决出TOP3后跳结果页
function nextMatch(){
  // 终止条件：选出TOP3
  if(state.winnerBracket.length ===1 && state.loserBracket.length===2){
    state.top3 = [state.winnerBracket[0], state.loserBracket[0], state.loserBracket[1]];
    state.page = "result";
    render();
    return;
  }
  // 配对：每次取出胜者组前两个对战
  if(state.winnerBracket.length >= 2){
    const p1 = state.winnerBracket.shift();
    const p2 = state.winnerBracket.shift();
    state.currentMatch = {player1:p1, player2:p2};
    state.page = "battle";
  }else if(state.winnerBracket.length ===1 && state.loserBracket.length >=2){
    // 胜者组只剩冠军，败者组继续内战
    const p1 = state.loserBracket.shift();
    const p2 = state.loserBracket.shift();
    state.currentMatch = {player1:p1, player2:p2};
    state.page = "battle";
  }
  render();
}

render();
</script>
</body>
</html>
